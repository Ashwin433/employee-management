services:

  frontend:
    build:
      context: ./frontend
    container_name: employee-frontend
    networks:
      - frontend-network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: employee-backend
    environment:
      PORT: 5000
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - backend-network
      - db-network
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: employee-mysql

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    networks:
      - db-network

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: employee-nginx

    ports:
      - "80:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      - frontend
      - backend

    networks:
      - frontend-network
      - backend-network

    restart: unless-stopped


networks:

  frontend-network:

  backend-network:

  db-network:
    internal: true


volumes:

  mysql-data:

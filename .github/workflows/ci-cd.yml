name: Employee Management CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  lint:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Backend lint
        working-directory: backend
        run: npm run lint

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Backend tests
        working-directory: backend
        run: npm test


  docker-build:
    runs-on: ubuntu-latest
    needs: lint

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build backend Docker image
        run: docker build -t employee-backend:${{ github.sha }} ./backend

      - name: Build frontend Docker image
        run: docker build -t employee-frontend:${{ github.sha }} ./frontend
      
      - name: Scan backend Docker image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: employee-backend:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Scan frontend Docker image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: employee-frontend:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

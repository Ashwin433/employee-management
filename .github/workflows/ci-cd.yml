name: Employee Management CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  # =========================
  # LINT AND TEST
  # =========================
  lint:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Backend lint
        working-directory: backend
        run: npm run lint

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Backend tests
        working-directory: backend
        run: npm test


  # =========================
  # DOCKER BUILD, SCAN & PUSH
  # =========================
  docker-build:
    runs-on: ubuntu-latest
    needs: lint

    steps:

      # -------------------------
      # Checkout
      # -------------------------
      - name: Checkout code
        uses: actions/checkout@v4


      # -------------------------
      # Build Backend
      # -------------------------
      - name: Build backend Docker image
        run: |
          docker build \
            -t employee-backend:${{ github.sha }} \
            ./backend


      # -------------------------
      # Build Frontend
      # -------------------------
      - name: Build frontend Docker image
        run: |
          docker build \
            -t employee-frontend:${{ github.sha }} \
            ./frontend


      # -------------------------
      # Scan Backend
      # -------------------------
      - name: Scan backend Docker image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: employee-backend:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH


      # -------------------------
      # Scan Frontend
      # -------------------------
      - name: Scan frontend Docker image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: employee-frontend:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH


      # -------------------------
      # Docker Hub Login
      # -------------------------
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      # -------------------------
      # Tag Backend Image
      # -------------------------
      - name: Tag backend image
        run: |
          docker tag \
            employee-backend:${{ github.sha }} \
            ${{ secrets.DOCKERHUB_USERNAME }}/employee-backend:latest

          docker tag \
            employee-backend:${{ github.sha }} \
            ${{ secrets.DOCKERHUB_USERNAME }}/employee-backend:${{ github.sha }}


      # -------------------------
      # Tag Frontend Image
      # -------------------------
      - name: Tag frontend image
        run: |
          docker tag \
            employee-frontend:${{ github.sha }} \
            ${{ secrets.DOCKERHUB_USERNAME }}/employee-frontend:latest

          docker tag \
            employee-frontend:${{ github.sha }} \
            ${{ secrets.DOCKERHUB_USERNAME }}/employee-frontend:${{ github.sha }}


      # -------------------------
      # Push Backend Image
      # -------------------------
      - name: Push backend image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/employee-backend:latest

          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/employee-backend:${{ github.sha }}


      # -------------------------
      # Push Frontend Image
      # -------------------------
      - name: Push frontend image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/employee-frontend:latest

          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/employee-frontend:${{ github.sha }}
